<!-- ===================== 开机 ===================== -->
<div id="boot">
  <div class="bt-photo"><canvas id="bootCv"></canvas><div class="bt-photo-cap">LOOKING UP · 1957</div></div>
  <div class="bt-paper">
    <div class="bt-title">星海公约</div>
    <div class="bt-sig">Stellar Covenant</div>
    <div class="bt-caps">AN ARBITRATION STORY　·　1957 — 2077</div>
    <button class="btn red" id="bootGo">进入星图</button>
    <label class="language-control" for="bootLanguage">Language / 语言 <select class="language-select" id="bootLanguage"><option value="zh-CN">简体中文</option><option value="en">English · preview</option></select></label>
    <p class="language-coverage" data-language-coverage></p>
    <div class="bt-motto">真实的是法，虚构的是国</div>
    <div class="bt-motto-en">The law is real. The nations are fictional.</div>
  </div>
</div>

<!-- ===================== 开场影像 ===================== -->
<div id="intro" class="layer">
  <div id="introFrame">
    <canvas id="introGL"></canvas>
    <canvas id="introCv"></canvas>
    <canvas id="introOv"></canvas>
    <div class="ishot" id="shotA"><video playsinline muted preload="auto"></video><svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg></div>
    <div class="ishot" id="shotB"><video playsinline muted preload="auto"></video><svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg></div>
  </div>
  <div id="introAI">画面由 AI 生成</div>
  <div id="introDip"></div>
  <div id="introTitle"><div class="it-name">星海公约</div><div class="it-sig">Stellar Covenant</div><div class="it-sub">1957 — 2077</div><div class="it-motto">真实的是法，虚构的是国<span>The law is real. The nations are fictional.</span></div></div>
  <div id="introVeil"></div>
  <div id="introSub"><div class="tx" id="introTx"></div></div>
  <div id="introHint">轻触屏幕跳到下一句</div>
  <div id="introCtl">
    <div id="introBar"><i id="introBarFill"></i></div>
    <button class="ibtn" id="introPause"><svg class="ic"><use href="#ic-pause"/></svg>暂停</button>
    <button class="ibtn" id="introSkip"><svg class="ic"><use href="#ic-skip"/></svg>跳过</button>
  </div>
</div>

<!-- ===================== 星图 ===================== -->
<div id="hub" class="layer">
  <div id="mapStage"><canvas id="mapFog"></canvas><canvas id="mapCv"></canvas><canvas id="mapFx"></canvas><div id="mapVig"></div><div id="mapLabels"></div></div>
  <div id="planetView"><canvas id="pvCv"></canvas><canvas id="pvGround"></canvas><svg id="pvPath"></svg><div id="pvHead"></div><div id="pvNodes"></div></div>
  <header id="hubHud">
    <button class="hud-me" id="hudMe"><span class="hud-av" id="hudAv"></span><span class="hud-who"><b id="hudName">简</b><small id="hudRank">见习仲裁员</small></span></button>
    <div class="hud-sp"></div>
    <button class="hud-focus" id="hudWork" title="秘书处 · 工时与调休（精力 70 以上开庭多一格气势）"><span class="hw-c" id="hudClock"></span><span class="hw-f"><span>精力</span><i><b id="hudFocusBar"></b></i><em id="hudFocusV">80</em></span></button>
    <button class="hud-dust" id="hudDustBtn" title="星尘"><svg class="ic fill"><use href="#ic-dust"/></svg><b id="hudDust">0</b><span class="hud-h"><svg class="ic"><use href="#ic-bulb"/></svg><b id="hudHints">0</b></span></button>
    <button class="iconbtn btn-snd" aria-label="音效"></button>
    <button class="iconbtn btn-bgm" aria-label="音乐"></button>
  </header>
  <nav id="hubBar">
    <div class="hub-actions"><button class="cta" id="btnStories"><span class="cta-k">人物主线 · 共同事件</span><b>回信前夜 / Night Shift</b></button>
    <button class="cta" id="btnNext"><span class="cta-k">继续主线</span><b id="ctaT">1980 · 天降核雨</b></button></div>
    <div class="map-ctl">
      <button id="mapIn" aria-label="放大">+</button>
      <button id="mapOut" aria-label="缩小">−</button>
      <button id="mapFit" aria-label="看全貌"><svg class="ic"><use href="#ic-target"/></svg></button>
    </div>
  </nav>
</div>

<!-- ===================== 面板 / 小游戏 ===================== -->
<div id="panel" class="layer"></div>
<div id="stories" class="layer" role="region" aria-label="人物主线"></div>
<div id="pen" class="layer"></div>
<div id="memo" class="layer"><div class="memo-card paper" id="memoCard"></div></div>
<div id="game" class="layer">
  <div class="gm-head"><button class="iconbtn" id="gmBack"><svg class="ic"><use href="#ic-back"/></svg></button><div class="gm-t"><b id="gmTitle"></b><span id="gmSub"></span></div><div class="gm-score" id="gmScore"></div></div>
  <div id="gmStage"></div>
  <div id="gmIntro" class="gm-card"></div>
  <div id="gmResult" class="gm-card"></div>
</div>

<!-- ===================== 剧场 ===================== -->
<div id="chapterCard" class="layer"></div>
<div id="theater" class="layer">
  <div id="thScene">
    <div id="thCam">
      <svg class="scene" id="scSvg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="th-beam"><i></i><i></i><b></b><b></b><b></b><b></b><b></b><b></b></div>
      <div id="thAmb"><div class="haze"></div><div class="mote"></div><div class="mote b"></div></div>
      <div class="actor mid" id="actM"></div>
      <svg class="scene fg" id="scBench" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="actor left" id="actL"></div>
      <div class="actor right" id="actR"></div>
      <svg class="scene fg" id="scDesk" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
    <div id="thGrade"></div>
    <button class="sr-edge l" id="srL"></button><button class="sr-edge r" id="srR"></button>
  </div>
  <div id="thHud">
    <div class="th-left"><div id="morale"></div><div id="standing"></div><div id="mission"></div></div>
    <div class="th-right"><span id="thYear"></span><button class="iconbtn sm" id="hintBtn" title="提示卡"><svg class="ic"><use href="#ic-bulb"/></svg></button><button class="iconbtn sm" id="thSkip" title="按住快进（或按住 Ctrl）"><svg class="ic"><use href="#ic-ff"/></svg></button><button class="iconbtn sm" id="thExit" title="退出本章"><svg class="ic"><use href="#ic-exit"/></svg></button></div>
  </div>
  <div id="srBar"></div>
  <div id="dlg">
    <div id="dlgInner"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgNext"><svg class="ic"><use href="#ic-down"/></svg></div></div>
  </div>
  <div id="crossbar">
    <button class="cbtn blue" id="btnPress"><span><kbd>Q</kbd>追问</span><small>让他多说一点</small></button>
    <button class="cbtn gold" id="btnEv"><span><kbd>W</kbd>出示证据</span><small>指出矛盾</small></button>
    <button class="cbtn jade" id="btnLaw"><span><kbd>E</kbd>引律</span><small>引用法条</small></button>
  </div>
  <div id="choices"></div>
  <div id="shelf"><div class="sh-in"><div class="sh-title" id="shelfTitle"></div><div id="shelfList"></div><button class="btn ghost sm" id="shelfCancel">取消</button></div></div>
  <div id="board"></div>
  <button id="inspectDone" class="btn sm">结束勘验</button>
  <div id="tipCard"></div>
</div>
<div id="verdict" class="layer"><div class="vdoc" id="vdoc"></div></div>
<div id="objection" class="layer"><div class="flash"></div><div class="seal" id="objWord">异<br>议</div></div>
<div id="ending" class="layer"></div>

<!-- ===================== 弹窗 ===================== -->
<div id="histCard" class="layer"></div>
<div id="avatar" class="layer"></div>
<div id="adModal" class="layer"><div class="ad-in paper"><div class="ad-k">激励视频 · 开发占位</div><div class="ad-why"></div><div class="ad-cnt">3</div><div class="muted small">正式版接入小程序/应用的广告组件后，这里会播放一段视频。</div><button class="btn ghost sm ad-close">不看了</button></div></div>
<div id="termTip"></div>
<div id="achpop"><svg class="ic" style="width:30px;height:30px;color:#E6B34D"><use href="#ic-star"/></svg><div><div class="at" id="acht"></div><div class="ad" id="achd"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="iris"></div>
<canvas id="fx"></canvas>
